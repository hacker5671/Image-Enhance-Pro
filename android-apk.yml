name: Build Image Enhance Pro APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare Android source layout
        run: |
          mkdir -p app/src/main/java/com/imageenhancepro
          cp AndroidManifest.xml app/src/main/AndroidManifest.xml
          cp MainActivity.kt app/src/main/java/com/imageenhancepro/MainActivity.kt
          sed -i '/import androidx.appcompat.app.AppCompatActivity/d' app/src/main/java/com/imageenhancepro/MainActivity.kt
          sed -i '/import androidx.lifecycle.lifecycleScope/d' app/src/main/java/com/imageenhancepro/MainActivity.kt

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Image-Enhance-Pro
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
